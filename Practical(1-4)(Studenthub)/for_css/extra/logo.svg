<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="logo-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)" filter="url(#logo-glow)">
    <!-- Base Rounded Shield / Hexagon -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logo-grad-primary)"/>
    
    <!-- Academic Cap / Mortarboard Outline & Details -->
    <!-- Cap Diamond -->
    <polygon points="26,12 44,21 26,30 8,21" fill="#ffffff"/>
    
    <!-- Cap Lower Skullcap -->
    <path d="M15,25.5 L15,34 C15,38 21,41 26,41 C31,41 37,38 37,34 L37,25.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tassel & Ribbon -->
    <path d="M38,23.5 L43,30 L43,37" fill="none" stroke="url(#logo-grad-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="38" r="2" fill="url(#logo-grad-accent)"/>
    <circle cx="26" cy="21" r="2" fill="#047857"/>

    <!-- Small Tech Network Nodes -->
    <circle cx="10" cy="42" r="2.5" fill="url(#logo-grad-accent)"/>
    <circle cx="26" cy="46" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Typographic Wordmark -->
  <!-- "Student" -->
  <text x="70" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.3">Student<tspan fill="#34d399">Hub</tspan></text>
  
  <!-- Subtitle Tagline -->
  <text x="71" y="49" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a7f3d0" letter-spacing="1.2" text-transform="uppercase">Smart Student Portal</text>
</svg>
