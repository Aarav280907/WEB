# Apache virtual host for the StudentHub portal (Practical 15 - intermediate extension).
# 1. Copy the project to  /var/www/studenthub   (folder names contain spaces/brackets? use the renamed copy)
# 2. Save this file as /etc/apache2/sites-available/studenthub.conf
# 3. sudo a2enmod rewrite headers && sudo a2ensite studenthub && sudo systemctl reload apache2
# 4. Add to /etc/hosts:   127.0.0.1  studenthub.local
<VirtualHost *:80>
    ServerName studenthub.local
    DocumentRoot /var/www/studenthub
    DirectoryIndex Html%20folder/home.html

    <Directory /var/www/studenthub>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SQL files and shell scripts must never be downloadable
    <FilesMatch "\.(sql|sh|dot|conf|md)$">
        Require all denied
    </FilesMatch>

    # Uploaded posters: images only, never executed
    <Directory /var/www/studenthub/Practical-12/uploads>
        php_admin_flag engine off
        Options -ExecCGI
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/studenthub-error.log
    CustomLog ${APACHE_LOG_DIR}/studenthub-access.log combined
</VirtualHost>
