<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Student Hub Portal</title>
  <link rel="stylesheet" href="../for_css/common.css">
  <link rel="stylesheet" href="../for_css/contact.css">
</head>
<body>
  <header>
    <h1>Student Hub Portal</h1>
    <nav>
      <a href="./home.html">Home</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./profile.html">Profile</a>
      <a href="./aboutus.html">About Us</a>
      <a href="./settings.html">Settings</a>
      <a href="./index.html">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Contact Us</h2>
    <section class="contact-info">
      <p><strong>Email:</strong> studenthub@university.edu</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
      <p><strong>Address:</strong> Student Hub Office, University Campus, Petlad, Gujarat, India</p>
    </section>

    <section class="contact-form">
      <h3>Send us a message</h3>
      <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Hub Portal. All rights reserved.</p>
  </footer>
</body>
</html>
