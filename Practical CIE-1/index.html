<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Feedback Form</h1>
        <p>Please share your feedback about the course.</p>
    </header>
    <main>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Feedback Form</h2>
      <form action="#" method="post">
    <section>
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" name="studentName" required>

      <label for="courseName">Course Name:</label>
      <input type="text" id="courseName" name="courseName" required>

      <label for="facultyName">Faculty Name:</label>
      <input type="text" id="facultyName" name="facultyName" required>
    </section>

    <section aria-label="Course ratings">
      <fieldset>
        <legend>Teaching Rating</legend>
        <input type="radio" id="teaching1" name="teachingRating" value="1" required>
        <label for="teaching1">1</label>
        <input type="radio" id="teaching2" name="teachingRating" value="2">
        <label for="teaching2">2</label>
        <input type="radio" id="teaching3" name="teachingRating" value="3">
        <label for="teaching3">3</label>
        <input type="radio" id="teaching4" name="teachingRating" value="4">
        <label for="teaching4">4</label>
        <input type="radio" id="teaching5" name="teachingRating" value="5">
        <label for="teaching5">5</label>
      </fieldset>

      <fieldset>
        <legend>Practical/Lab Rating</legend>
        <input type="radio" id="lab1" name="labRating" value="1" required>
        <label for="lab1">1</label>
        <input type="radio" id="lab2" name="labRating" value="2">
        <label for="lab2">2</label>
        <input type="radio" id="lab3" name="labRating" value="3">
        <label for="lab3">3</label>
        <input type="radio" id="lab4" name="labRating" value="4">
        <label for="lab4">4</label>
        <input type="radio" id="lab5" name="labRating" value="5">
        <label for="lab5">5</label>
      </fieldset>

      <fieldset>
        <legend>Content Rating</legend>
        <input type="radio" id="content1" name="contentRating" value="1" required>
        <label for="content1">1</label>
        <input type="radio" id="content2" name="contentRating" value="2">
        <label for="content2">2</label>
        <input type="radio" id="content3" name="contentRating" value="3">
        <label for="content3">3</label>
        <input type="radio" id="content4" name="contentRating" value="4">
        <label for="content4">4</label>
        <input type="radio" id="content5" name="contentRating" value="5">
        <label for="content5">5</label>
      </fieldset>
    </section>

    <section>
      <label for="comments">Comments:</label>
      <textarea id="comments" name="comments" rows="5"></textarea>
    </section>

    <section id="feedbackSummary" aria-live="polite"></section>
    <section id="recommendations" aria-live="polite"></section>

    <button type="submit">Submit Feedback</button>
    <button type="reset">Reset Feedback</button>
  </form>
</section>
</main>
<footer>
    <p>Thank you for taking the time to provide feedback.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
