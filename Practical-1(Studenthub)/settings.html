<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Student Hub Portal</title>
  
  <style>
    body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  margin: 0;
  padding: 0;
  line-height: 1.6;
    }

a {
  color: #d97706;
  text-decoration: dashed;
  font-weight: normal;
  transition: color 0.3s ease;
}

header {
  background: #065f46;
  color: #fff;
  padding: 15px 20px;
}
header h1 {
  margin: 0;
  font-size: 24px;
}
nav {
  margin-top: 10px;
}
nav a {
  color: #fff;
  text-decoration: none;
  margin-right: 15px;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 6px;
  transition: background 0.25s ease;
}
nav a:hover {
  background: rgba(255,255,255,0.15);
  text-decoration: none;
}
footer {
    background: #065f46;
    color: #fff;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
  </style>
</head>
<body>
  <header>
    <h1>Student Hub Portal</h1>
    <nav>
      <a href="./home.html">Home</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./profile.html">Profile</a>
      <a href="./contact.html">Contact Us</a>
      <a href="./aboutus.html">About Us</a>
      <a href="./index.html">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Settings</h2>

    <section class="account-settings">
      <h3>Account Settings</h3>
      <ul>
        <li><a href="./change-password.html">Change Password</a></li>
        <li><a href="./update-email.html">Update Email/Phone</a></li>
        <li><a href="./edit-profile.html">Edit Profile Picture</a></li>
      </ul>
    </section>

    <section class="preferences">
      <h3>Preferences</h3>
      <form>
        <label for="theme">Theme:</label>
        <select id="theme" name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select><br><br>

        <label for="language">Language:</label>
        <select id="language" name="language">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select><br><br>

        <label>
          <input type="checkbox" name="notifications" checked> Enable Notifications
        </label>
      </form>
    </section>
  
  </main>

  <footer>
    <p>&copy; 2026 Student Hub Portal</p>
  </footer>
</body>
</html>
