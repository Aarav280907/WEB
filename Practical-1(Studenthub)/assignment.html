<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" type="text/css" href="class.css">
    <style>
        /* General Page Styling */
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 0;
}

/* Header */
header {
  background: #004080;
  color: #fff;
  padding: 15px 20px;
}
header h1 {
  margin: 0;
  font-size: 24px;
}
nav {
  margin-top: 10px;
}
nav a {
  color: #fff;
  text-decoration: none;
  margin-right: 15px;
  font-weight: bold;
}
nav a:hover {
  text-decoration: underline;
}

/* Content Section */
.content {
  max-width: 800px;
  margin: 40px auto;
  background: #fff;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
.content h1 {
  color: #004080;
  text-align: center;
  margin-bottom: 20px;
}
.content h2 {
  color: #2d3748;
  margin-top: 20px;
}
.content p {
  color: #555;
  line-height: 1.6;
}

/* List Styling */
.content ul {
  list-style-type: square;
  padding-left: 20px;
}
.content ul li {
  margin-bottom: 8px;
  color: #333;
}

/* Button Styling */
button {
  display: block;
  margin: 20px auto;
  padding: 10px 20px;
  background: #004080;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s ease;
}
button:hover {
  background: #0066cc;
}

    </style>
</head>
<body>
    <header>
    <h1>Student Hub Portal</h1>
    <nav>
      <a href="./home.html">Home</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./profile.html">Profile</a>
      <a href="./contact.html">Contact Us</a>
      <a href="./settings.html">Settings</a>
      <a href="./index.html">Logout</a>
    </nav>
  </header>
    <div class="content">
    <h1>Welcome to My Assignment</h1>
    <p>This is a sample webpage created for practice. It includes basic HTML elements styled with CSS.</p>
    
    <h2>Topics Covered</h2>
    <ul>
        <li>HTML Structure</li>
        <li>CSS Styling</li>
        <li>Lists and Buttons</li>
    </ul>

    <button>Click Me</button>
    </div>
</body>
</html>
