<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Student Hub Portal</title>
  <link rel="stylesheet" href="class.css">
  <style>
body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
      line-height: 1.6;
}

a {
  color: #d97706;
  text-decoration: dashed;
  font-weight: normal;
  transition: color 0.3s ease;
}

/* Header */
header {
  background: #065f46;
  color: #fff;
  padding: 15px 20px;
}
header h1 {
  margin: 0;
  font-size: 24px;
}
nav {
  margin-top: 10px;
}
nav a {
  color: #fff;
  text-decoration: none;
  margin-right: 15px;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 6px;
  transition: background 0.25s ease;
}
nav a:hover {
  background: rgba(255, 255, 255, 0.15);
  text-decoration: none;
}
main {
  max-width: 800px;
  margin: 40px auto;
  background: #fff;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
main h2 {
  color: #065f46;
  text-align: center;
  margin-bottom: 20px;
}
.contact-info p {
  color: #475569;
  margin-bottom: 10px;
}
    /* Contact Form Styling */
.contact-form {
   margin-top: 30px;
}

.contact-form h3 {
  color: #1e293b;
  margin-bottom: 20px;
  text-align: center;
}

.contact-form label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
  color: #334155;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}


.contact-form textarea {
  resize: vertical;
}

.contact-form button {
  display: block;
  width: 100%;
  padding: 12px;
  background: #065f46;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.contact-form button:hover {
  background: #064e3b;
}

  </style>
</head>
<body>
  <header>
    <h1>Student Hub Portal</h1>
    <nav>
      <a href="./home.html">Home</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./profile.html">Profile</a>
      <a href="./aboutus.html">About Us</a>
      <a href="./settings.html">Settings</a>
      <a href="./index.html">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Contact Us</h2>
    <section class="contact-info">
      <p><strong>Email:</strong> studenthub@university.edu</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
      <p><strong>Address:</strong> Student Hub Office, University Campus, Petlad, Gujarat, India</p>
    </section>

    <section class="contact-form">
      <h3>Send us a message</h3>
      <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Hub Portal. All rights reserved.</p>
  </footer>
</body>
</html>
